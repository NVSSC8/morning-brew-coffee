apiVersion: v1
kind: Service
metadata:
  name: morning-brew-service
  labels:
    app: morning-brew
spec:
  type: LoadBalancer # Automatically provisions an AWS Network/Application Load Balancer on EKS
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: morning-brew
